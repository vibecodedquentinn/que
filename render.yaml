# Render Blueprint — ein Secret: LLM_API_KEY (OpenRouter)
services:
  - type: web
    name: juergen
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/status
    envVars:
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: LLM_TEMPERATURE
        value: "0.35"
      - key: LLM_API_KEY
        sync: false
      - key: ASSISTANT_NAME
        value: J.Ü.R.G.E.N.
      - key: USER_TITLE
        value: Max
      - key: DEFAULT_LANGUAGE
        value: de
      - key: SMART_HOME_PROVIDER
        value: mock
      - key: FRITZBOX_ENABLED
        value: "false"
      - key: TTS_PROVIDER
        value: piper
      - key: PIPER_VOICE
        value: de_DE-thorsten-high
    disk:
      name: juergen-data
      mountPath: /app/data
      sizeGB: 1
