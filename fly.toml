# fly deploy — Jürgen nur in der Cloud
# Secrets: fly secrets set LLM_API_KEY=... PUBLIC_URL=https://xxx.fly.dev

app = "juergen-home"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_BASE_URL = "https://openrouter.ai/api/v1"
  LLM_MODEL = "openrouter/free"
  LLM_TEMPERATURE = "0.35"
  ASSISTANT_NAME = "J.Ü.R.G.E.N."
  DEFAULT_LANGUAGE = "de"
  SMART_HOME_PROVIDER = "mock"
  TTS_PROVIDER = "piper"
  PIPER_VOICE = "de_DE-thorsten-high"
  FRITZBOX_ENABLED = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "juergen_data"
  destination = "/app/data"
