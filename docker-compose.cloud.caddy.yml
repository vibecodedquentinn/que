# HTTPS auf dem VPS (Let's Encrypt). DOMAIN und PUBLIC_URL in .env setzen.
#
#   docker compose -f docker-compose.cloud.yml -f docker-compose.cloud.caddy.yml up -d --build

services:
  juergen:
    ports: !reset []
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      JUERGEN_BASIC_AUTH_USER: ${JUERGEN_BASIC_AUTH_USER:-}
      JUERGEN_BASIC_AUTH_HASH: ${JUERGEN_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile.cloud:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - juergen
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
