services:
  jarvis:
    build: .
    ports:
      - "8080:8000"
    env_file:
      - .env
    volumes:
      - jarvis-data:/app/data
    restart: unless-stopped

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    ports:
      - "8443:8443"
      - "8081:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - jarvis
    restart: unless-stopped

volumes:
  jarvis-data:
